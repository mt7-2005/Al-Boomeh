<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Order tracker</title>
</head>
<body>
    <h3>Live order tracker</h3>
    <p>Token: <input id="token" size="60"></p>
    <p>Order id: <input id="orderId" size="10"> <button onclick="watchOrder()">Watch order</button></p>
    <p>Store id: <input id="storeId" size="10"> <button onclick="watchStore()">Watch store</button></p>
    <h4>Status: <span id="status">unknown</span></h4>
    <ul id="log"></ul>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8/dist/browser/signalr.min.js"></script>
    <script>
    let conn;

    function write(text) {
      const item = document.createElement('li');
      item.textContent = new Date().toLocaleTimeString() + ' — ' + text;
      document.getElementById('log').appendChild(item);
    }

    function showStatus(status) {
      document.getElementById('status').textContent = status;
    }

    async function connect() {
      if (conn) {
        return;
      }

      const token = document.getElementById('token').value;

      const connection = new signalR.HubConnectionBuilder()
        .withUrl('/hubs/orders?access_token=' + token)
        .withAutomaticReconnect({ nextRetryDelayInMilliseconds: () => 5000 })
        .build();

      connection.on('OrderStatusChanged', message => {
        showStatus(message.status);
        write('order ' + message.orderId + ' is now ' + message.status);
      });

      connection.on('OrderPlaced', message => {
        write('new order ' + message.orderId);
      });

      connection.onreconnecting(() => write('connection lost, trying again every 5 seconds'));
      connection.onreconnected(() => write('reconnected'));
      connection.onclose(() => write('connection closed'));

      await connection.start();
      conn = connection;
      write('connected');
    }

    async function watchOrder() {
      const orderId = Number(document.getElementById('orderId').value);

      try {
        await connect();
        await conn.invoke('WatchOrder', orderId);
        write('watching order ' + orderId);
      } catch (error) {
        write('error: ' + error.message);
      }
    }

    async function watchStore() {
      const storeId = Number(document.getElementById('storeId').value);

      try {
        await connect();
        await conn.invoke('WatchStore', storeId);
        write('watching store ' + storeId);
      } catch (error) {
        write('error: ' + error.message);
      }
    }
    </script>
</body>
</html>
